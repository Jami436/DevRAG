[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "devrag"
version = "0.1.0"
description = "A production-oriented RAG platform for technical/developer documentation"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [
    { name = "Muhammad Jami Ahad" },
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Documentation",
]

[project.urls]
Repository = "https://github.com/devrag/devrag"

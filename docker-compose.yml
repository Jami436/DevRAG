services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: devrag
      POSTGRES_PASSWORD: devrag
      POSTGRES_DB: devrag
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devrag -d devrag"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://devrag:devrag@db:5432/devrag
      DEBUG: "false"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      RERANKER_PROVIDER: ${RERANKER_PROVIDER:-cross_encoder}
      GENERATION_PROVIDER: ${GENERATION_PROVIDER:-openai}
    volumes:
      - model_cache:/home/devrag/.cache
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  model_cache: